<!doctype html>
<html lang="en">
<head>
  <meta charset="utf-8" />
  <meta name="viewport" content="width=device-width,initial-scale=1" />
  <title>SAU Student Access</title>
  <link rel="stylesheet" href="../assets/css/style.css" />
  <link rel="preconnect" href="https://fonts.googleapis.com">
<link rel="preconnect" href="https://fonts.gstatic.com" crossorigin>

<link href="https://fonts.googleapis.com/css2?family=Cormorant+Garamond:wght@500;600;700&family=Inter:wght@300;400;500;600&display=swap" rel="stylesheet">
</head>
<body>
  <div class="wrap">
    <section class="panel">
      <h1>SAU Student Access</h1>
      <p>Temporary credentials required.</p>

      <p class="hint">
        Temporary access was issued under a restricted archive request.
        Check the orientation clip closely.
      </p>

      <form data-login-form>
        <label for="student-id">Student ID</label>
        <input id="student-id" type="text" placeholder="SAU-_____" autocomplete="off" />

        <label for="access-code">Access Code</label>
        <input id="access-code" type="password" placeholder="Enter code" autocomplete="off" />

        <button type="submit">Login</button>
      </form>

      <p class="system-note" data-status></p>

      <p><a class="button secondary" href="../index.html">Back to Home</a></p>
    </section>
  </div>

  <audio id="access-sfx" src="../assets/audio/access-denied.mp3"></audio>
  <audio id="error-sfx" src="../assets/audio/access-denied.mp3"></audio>
  <script src="../assets/js/game.js"></script>
</body>
</html>
